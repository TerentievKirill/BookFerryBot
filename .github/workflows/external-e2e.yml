name: External E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  external-e2e:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: test-token
      API_BASE_URL: https://api.heartlab.app
      TEST_TELEGRAM_ID: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g allure-commandline

      - name: Run external E2E
        id: e2e
        continue-on-error: true
        run: pytest tests/test_external_e2e.py -v -s -m e2e --alluredir=allure-results

      - name: Restore Allure history
        if: always()
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            mkdir -p previous-report
            git archive origin/gh-pages | tar -x -C previous-report
            if [ -d previous-report/history ]; then
              cp -r previous-report/history allure-results/history
            fi
          fi

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report
          touch allure-report/.nojekyll

      - name: Publish Allure report
        if: always()
        run: |
          cp -a allure-report /tmp/allure-report

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-build
          git rm -rf . || true
          git clean -fdx
          cp -a /tmp/allure-report/. .
          git add -A
          git commit -m "update Allure report"
          git push --force origin HEAD:gh-pages

      - name: Fail workflow if tests failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
